services:
  postgres:
    image: postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: hms_test
      POSTGRES_PASSWORD: hms_test_only
      POSTGRES_DB: hms_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_test -d hms_test"]
      interval: 2s
      timeout: 3s
      retries: 30
