name: hms-dev

services:
  postgres:
    image: postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: hms_dev
      POSTGRES_PASSWORD: hms_dev_only
      POSTGRES_DB: hms
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hms_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_dev -d hms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hms_postgres_data:
