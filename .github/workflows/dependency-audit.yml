name: Dependency audit (informational)

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA pinning is deferred until each action commit can be verified from an authoritative source.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit (informational)
        run: pnpm audit --prod
        continue-on-error: true
      - name: Full dependency audit (informational)
        run: pnpm audit
        continue-on-error: true
